server {
    listen 80;
    server_name in-sight.app;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location = / {
        return 301 https://$host/login/;
    }

    location = /login {
        return 301 https://$host/login/;
    }

    location /login/ {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name in-sight.app;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/in-sight.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/in-sight.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    underscores_in_headers on;

    location = /login {
        return 301 /login/;
    }

    location /login/ {
        proxy_pass http://insight:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
